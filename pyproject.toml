[project]
name = "qa-automation-agents"
version = "0.2.0"
description = "GraphRAG-only knowledge base ingestion and retrieval platform."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Multi-Agentic RAG Contributors" }
]
license = { text = "MIT" }
keywords = ["rag", "graphrag", "knowledge-graph", "postgresql", "chroma", "neo4j"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "python-dotenv>=1.0.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "structlog>=24.1.0",
  "chromadb>=0.5.0",
  "sentence-transformers>=3.0.0",
  "langgraph>=0.2.0",
  "openai>=1.99.0",
  "PyYAML>=6.0.0",
  "pymupdf>=1.24.0",
  "pdfplumber>=0.11.0",
  "python-docx>=1.1.2",
  "neo4j>=5.23.0",
]

[project.urls]
Homepage = "https://github.com/local/multi-agentic-rag"
Repository = "https://github.com/local/multi-agentic-rag"

[project.scripts]
multi-agentic-rag = "multi_agentic_rag.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]
parsing = [
  "pymupdf>=1.24.0",
  "pdfplumber>=0.11.0",
  "python-docx>=1.1.2",
]
cpu = [
  "torch>=2.12.0",
]
gpu = [
  "torch>=2.12.0",
  "sentence-transformers>=3.0.0",
]
hf-reasoning = [
  "transformers>=4.51.0",
  "accelerate>=1.0.0",
  "safetensors>=0.4.0",
]
gemini = [
  "google-genai>=1.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "gpu" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'", extra = "cpu" },
  { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers --basetemp=.pytest_tmp"
markers = [
  "integration: tests that exercise an end-to-end path or external service boundary",
  "tiger_cloud: opt-in tests against dedicated Tiger Cloud PostgreSQL resources",
  "gpu: opt-in tests that require physical CUDA hardware",
]
norecursedirs = [
  ".git",
  ".venv",
  ".pytest_tmp",
  ".multi_agentic_rag",
  ".cache",
  "generated",
  "neo4j-desktop-data",
  "site-packages",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["multi_agentic_rag"]
warn_return_any = true
warn_unused_configs = true
strict = true
ignore_missing_imports = true
