[project]
name = "multi-agentic-rag"
version = "0.1.0"
description = "Local-first graph-based agentic RAG framework for versioned engineering documents."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Multi-Agentic RAG Contributors" }
]
license = { text = "MIT" }
keywords = [
  "rag",
  "graphrag",
  "knowledge-graph",
  "langgraph",
  "fastapi",
  "requirements-engineering"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "python-dotenv>=1.0.0",
  "langgraph>=0.2.0",
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-huggingface>=0.1.0",
  "langchain-text-splitters>=0.3.0",
  "chromadb>=0.5.0",
  "sentence-transformers>=3.0.0",
  "transformers>=4.44.0",
  "accelerate>=0.33.0",
  "torch>=2.3.0",
  "pymupdf>=1.24.0",
  "pdfplumber>=0.11.0",
  "python-docx>=1.1.2",
  "neo4j>=5.23.0",
  "sqlalchemy>=2.0.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/local/multi-agentic-rag"
Repository = "https://github.com/local/multi-agentic-rag"

[project.scripts]
multi-agentic-rag = "multi_agentic_rag.cli:app"
multi-rag = "multi_agentic_rag.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]
api = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
]
graph = [
  "neo4j>=5.23.0",
]
local-vector = [
  "chromadb>=0.5.0",
]
gpu = [
  "torch>=2.3.0",
  "sentence-transformers>=3.0.0",
  "transformers>=4.44.0",
  "accelerate>=0.33.0",
]
parsing = [
  "pymupdf>=1.24.0",
  "pdfplumber>=0.11.0",
  "python-docx>=1.1.2",
]
ocr = [
  "pytesseract>=0.3.13",
  "pillow>=10.4.0",
]
mcp = [
  "mcp>=1.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"
norecursedirs = [
  ".git",
  ".venv",
  ".multi_agentic_rag",
  ".cache",
  "generated",
  "**pycache**",
  "tests/generated",
  "AppData",
  "site-packages",
  "archive-v0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
packages = ["multi_agentic_rag"]
warn_return_any = true
warn_unused_configs = true
